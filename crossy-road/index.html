  circle-vs-AABB collision detection, and camera lerp. I directed

  colour palette, and tested gameplay to identify and fix edge cases

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Road Racer</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
    }

    /* HUD — score display (top-center) */
    #hud-score {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-family: monospace;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 1px 4px #000;
      pointer-events: none;
      user-select: none;
    }

    /* Game-over overlay */
    #overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    #overlay.visible {
      display: flex;
    }

    #overlay-title {
      color: #fff;
      font-family: monospace;
      font-size: 48px;
      font-weight: bold;
      text-shadow: 0 2px 8px #000;
    }

    #overlay-score {
      color: #eee;
      font-family: monospace;
      font-size: 28px;
      text-shadow: 0 1px 4px #000;
    }

    #btn-restart {
      margin-top: 8px;
      padding: 12px 32px;
      font-family: monospace;
      font-size: 20px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #33cc33;
      color: #fff;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      transition: background 0.15s;
    }

    #btn-restart:hover {
      background: #29a829;
    }
  </style>
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <div id="hud-score">Score: 0</div>

  <div id="overlay">
    <div id="overlay-title">Game Over</div>
    <div id="overlay-score">Score: 0</div>
    <button id="btn-restart">Restart</button>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // -------------------------------------------------------------------------
    // Constants
    // -------------------------------------------------------------------------
    const ROAD_WIDTH      = 11;
    const ROW_DEPTH       = 1.0;
    const PLAYER_SPEED    = 5.0;
    const PLAYER_LATERAL  = 6.0;
    const ACCEL           = 18.0;
    const FRICTION        = 10.0;
    const DIFF_HARD       = 20;
    const CULL_BEHIND     = 20;
    const GENERATE_AHEAD  = 12;
    const BUFFER_TRIGGER  = 6;
    const START_Z         = 0;

    const COLOR_PLAYER     = 0xffdd00;
    const COLOR_CAR        = 0xff3333;
    const COLOR_TRUCK      = 0xff8800;
    const COLOR_GRASS      = 0x55aa44;
    const COLOR_ROAD       = 0x555555;
    const COLOR_TRUCK_ROAD = 0x333333;
    const COLOR_ROAD_LINE  = 0xffff99;

    // -------------------------------------------------------------------------
    // Renderer
    // -------------------------------------------------------------------------
    class Renderer {
      constructor() {
        this.scene  = null;
        this.camera = null;
        this.webgl  = null;
        this.CAMERA_OFFSET   = new THREE.Vector3(0, 8, 8);
        this.TARGET_ROTATION = new THREE.Euler(-0.65, 0, 0);
      }

      init(canvas) {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x87ceeb);

        this.webgl = new THREE.WebGLRenderer({ canvas, antialias: true });
        this.webgl.setPixelRatio(window.devicePixelRatio);
        this.webgl.setSize(window.innerWidth, window.innerHeight);

        const aspect = window.innerWidth / window.innerHeight;
        this.camera = new THREE.PerspectiveCamera(60, aspect, 0.1, 500);
        this.camera.rotation.copy(this.TARGET_ROTATION);
        this.camera.position.set(
          this.CAMERA_OFFSET.x,
          this.CAMERA_OFFSET.y,
          START_Z + this.CAMERA_OFFSET.z
        );

        window.addEventListener('resize', () => {
          this.webgl.setSize(window.innerWidth, window.innerHeight);
          this.camera.aspect = window.innerWidth / window.innerHeight;
          this.camera.updateProjectionMatrix();
        });

        return this.scene;
      }

      update(playerWorldPos) {
        const targetX = playerWorldPos.x + this.CAMERA_OFFSET.x;
        const targetY = playerWorldPos.y + this.CAMERA_OFFSET.y;
        const targetZ = playerWorldPos.z + this.CAMERA_OFFSET.z;

        this.camera.position.x += (targetX - this.camera.position.x) * 0.10;
        this.camera.position.y += (targetY - this.camera.position.y) * 0.10;
        this.camera.position.z += (targetZ - this.camera.position.z) * 0.10;
      }

      // Instantly snap camera to the correct position above a world point.
      // Call this on init and on restart to avoid lerp pop.
      snapTo(playerWorldPos) {
        this.camera.position.set(
          playerWorldPos.x + this.CAMERA_OFFSET.x,
          playerWorldPos.y + this.CAMERA_OFFSET.y,
          playerWorldPos.z + this.CAMERA_OFFSET.z
        );
      }

      render() {
        this.webgl.render(this.scene, this.camera);
      }
    }

    // -------------------------------------------------------------------------
    // Build a car/truck group mesh
    // -------------------------------------------------------------------------
    function buildVehicleMesh(width, height, depth, bodyColor, cabColor) {
      const group = new THREE.Group();

      // Body
      const bodyGeo = new THREE.BoxGeometry(width, height, depth);
      const bodyMat = new THREE.MeshBasicMaterial({ color: bodyColor });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = height / 2;
      group.add(body);

      // Cab on top, toward the front
      const cabW = width * 0.6;
      const cabH = height * 0.7;
      const cabD = depth * 0.45;
      const cabGeo = new THREE.BoxGeometry(cabW, cabH, cabD);
      const cabMat = new THREE.MeshBasicMaterial({ color: cabColor });
      const cab = new THREE.Mesh(cabGeo, cabMat);
      cab.position.set(0, height + cabH / 2, -depth * 0.1);
      group.add(cab);

      return group;
    }

    // -------------------------------------------------------------------------
    // Row generator
    // -------------------------------------------------------------------------
    function generateRow(rowIndex, previousRows, score) {
      // Spawn zone: first few rows always grass
      if (rowIndex <= 3) {
        return { type: 'grass', index: rowIndex, obstacles: [] };
      }

      const tier = score < DIFF_HARD ? 0 : 1;

      // Count trailing runs
      let roadRun = 0;
      for (let i = previousRows.length - 1; i >= 0; i--) {
        if (previousRows[i].type === 'road') roadRun++;
        else break;
      }
      let truckRun = 0;
      for (let i = previousRows.length - 1; i >= 0; i--) {
        if (previousRows[i].type === 'truck') truckRun++;
        else break;
      }
      // Combined consecutive hazard rows (any mix of road + truck)
      let hazardRun = 0;
      for (let i = previousRows.length - 1; i >= 0; i--) {
        const t = previousRows[i].type;
        if (t === 'road' || t === 'truck') hazardRun++;
        else break;
      }
      // Consecutive grass rows since last hazard
      let grassRun = 0;
      for (let i = previousRows.length - 1; i >= 0; i--) {
        if (previousRows[i].type === 'grass') grassRun++;
        else break;
      }

      const allowed = ['grass', 'road', 'truck'];

      // After any hazard section, require at least 2 grass rows before next hazard
      // This prevents single-grass "blips" between back-to-back hazard clusters
      const hadHazardRecently = previousRows.some(r => r.type === 'road' || r.type === 'truck');
      if (hadHazardRecently && grassRun < 2 && grassRun > 0) {
        // Just had 1 grass after hazards — force another grass
        return { type: 'grass', index: rowIndex, obstacles: [] };
      }

      // Individual type caps: max 2 of the same type in a row
      if (roadRun  >= 2) allowed.splice(allowed.indexOf('road'),  1);
      if (truckRun >= 2) allowed.splice(allowed.indexOf('truck'), 1);

      // Combined hazard cap: max 2 consecutive hazard rows total
      if (hazardRun >= 2) {
        allowed.length = 0;
        allowed.push('grass');
      }
      if (allowed.length === 0) allowed.push('grass');

      // If grass is the only option, return immediately
      if (allowed.length === 1 && allowed[0] === 'grass') {
        return { type: 'grass', index: rowIndex, obstacles: [] };
      }

      // Weights tuned for readable rhythm: roughly 1–2 hazard rows then 2 grass
      const weights = tier === 0
        ? { grass: 0.55, road: 0.30, truck: 0.15 }
        : { grass: 0.40, road: 0.38, truck: 0.22 };

      let total = 0;
      for (const t of allowed) total += weights[t];
      let rand = Math.random() * total;
      let chosen = allowed[0];
      for (const t of allowed) {
        rand -= weights[t];
        if (rand <= 0) { chosen = t; break; }
      }

      return buildRowConfig(rowIndex, chosen, tier);
    }

    function buildRowConfig(rowIndex, type, tier) {
      const config = { type, index: rowIndex, obstacles: [] };

      if (type === 'road') {
        const count     = 1 + Math.floor(Math.random() * 3); // 1–3
        const direction = Math.random() < 0.5 ? 1 : -1;
        const minSpeed  = tier === 0 ? 2 : 4;
        const maxSpeed  = tier === 0 ? 7 : 11;
        const width     = 0.75;
        const depth     = 0.9;
        // ONE speed for the whole row — prevents faster cars catching slower ones
        const rowSpeed  = minSpeed + Math.random() * (maxSpeed - minSpeed);
        config.direction = direction;

        const positions = placeObstacles(count, width, 0.5);
        for (const x of positions) {
          config.obstacles.push({ type: 'car', row: rowIndex, x, width, depth, height: 0.35, speed: rowSpeed, direction });
        }

      } else if (type === 'truck') {
        const count     = 1 + Math.floor(Math.random() * 2); // 1–2
        const direction = Math.random() < 0.5 ? 1 : -1;
        const minSpeed  = tier === 0 ? 1 : 2;
        const maxSpeed  = tier === 0 ? 3 : 5;
        const width     = 1.8;
        const depth     = 0.95;
        // ONE speed for the whole row
        const rowSpeed  = minSpeed + Math.random() * (maxSpeed - minSpeed);
        config.direction = direction;

        const positions = placeObstacles(count, width, 0.6);
        for (const x of positions) {
          config.obstacles.push({ type: 'truck', row: rowIndex, x, width, depth, height: 0.45, speed: rowSpeed, direction });
        }
      }

      return config;
    }

    /**
     * Sequential left-to-right obstacle placement — guarantees no overlaps.
     * @param {number} count   - how many obstacles to attempt
     * @param {number} width   - each obstacle's width
     * @param {number} gap     - minimum gap before each obstacle
     * @returns {number[]}     - array of x center positions
     */
    function placeObstacles(count, width, gap) {
      const positions = [];
      let cursor = -ROAD_WIDTH / 2;
      // Total slack space after placing all obstacles with minimum gaps
      const slack = Math.max(0, ROAD_WIDTH - count * (width + gap) - gap);

      for (let i = 0; i < count; i++) {
        // Minimum safe center for this obstacle
        const xCenter = cursor + gap + width / 2;
        // Right edge of this obstacle
        const xRight = xCenter + width / 2;
        if (xRight > ROAD_WIDTH / 2 - 0.2) break; // no room, stop placing
        positions.push(xCenter);
        // Advance cursor past this obstacle, then add a random portion of slack
        cursor = xRight + Math.random() * (slack / count);
      }

      return positions;
    }

    // -------------------------------------------------------------------------
    // World
    // -------------------------------------------------------------------------
    class World {
      constructor() {
        this.rows          = new Map();
        this.frontierIndex = 0;
        this._scene        = null;
        this._score        = 0;
      }

      init(scene, score = 0) {
        this._scene = scene;
        this._score = score;

        // 5 grass rows behind start, 12 ahead
        for (let i = -5; i <= 12; i++) {
          this._addRow(i);
        }
        this.frontierIndex = 12;
      }

      update(dt, playerRowIndex, gameState, score) {
        this._score = score;

        if (gameState !== 'gameover') {
          const halfWorld = ROAD_WIDTH / 2;
          for (const row of this.rows.values()) {
            for (const obs of row.obstacles) {
              obs.x += obs.speed * obs.direction * dt;
              // Wrap at road edges
              if (obs.x >  halfWorld + obs.width / 2) obs.x -= ROAD_WIDTH + obs.width;
              if (obs.x < -halfWorld - obs.width / 2) obs.x += ROAD_WIDTH + obs.width;
              obs.mesh.position.x = obs.x;
            }
          }
        }

        this.generateAheadIfNeeded(playerRowIndex);
        this.cullBehind(playerRowIndex);
      }

      generateAheadIfNeeded(playerRowIndex) {
        const bufferAhead = this.frontierIndex - playerRowIndex;
        if (bufferAhead <= BUFFER_TRIGGER) {
          for (let i = 0; i < GENERATE_AHEAD; i++) {
            this.frontierIndex++;
            this._addRow(this.frontierIndex);
          }
        }
      }

      cullBehind(playerRowIndex) {
        for (const [index, row] of this.rows) {
          if (index < playerRowIndex - CULL_BEHIND) {
            row.dispose();
            this.rows.delete(index);
          }
        }
      }

      getRow(index) {
        return this.rows.get(index);
      }

      reset(score = 0) {
        for (const row of this.rows.values()) {
          row.dispose();
        }
        this.rows.clear();
        this.frontierIndex = 0;
        this.init(this._scene, score);
      }

      _addRow(rowIndex) {
        let config;
        if (rowIndex <= 3) {
          config = { type: 'grass', index: rowIndex, obstacles: [] };
        } else {
          const previousRows = [];
          for (let idx = rowIndex - 1; idx >= rowIndex - 10 && this.rows.has(idx); idx--) {
            previousRows.unshift(this.rows.get(idx));
          }
          config = generateRow(rowIndex, previousRows, this._score);
        }

        const scene = this._scene;
        const disposables = [];

        // --- Terrain plane ---
        const terrainColor = config.type === 'road'  ? COLOR_ROAD
                           : config.type === 'truck' ? COLOR_TRUCK_ROAD
                           : COLOR_GRASS;
        const terrainGeo = new THREE.PlaneGeometry(ROAD_WIDTH, ROW_DEPTH);
        const terrainMat = new THREE.MeshBasicMaterial({ color: terrainColor });
        const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
        terrainMesh.rotation.x = -Math.PI / 2;
        terrainMesh.position.set(0, 0, -rowIndex * ROW_DEPTH);
        scene.add(terrainMesh);
        disposables.push({ mesh: terrainMesh, geo: terrainGeo, mat: terrainMat });

        // --- Lane markings for road/truck rows ---
        if (config.type === 'road' || config.type === 'truck') {
          for (const lx of [-2.5, 0, 2.5]) {
            const lineGeo = new THREE.PlaneGeometry(0.06, ROW_DEPTH * 0.7);
            const lineMat = new THREE.MeshBasicMaterial({ color: COLOR_ROAD_LINE });
            const lineMesh = new THREE.Mesh(lineGeo, lineMat);
            lineMesh.rotation.x = -Math.PI / 2;
            lineMesh.position.set(lx, 0.002, -rowIndex * ROW_DEPTH);
            scene.add(lineMesh);
            disposables.push({ mesh: lineMesh, geo: lineGeo, mat: lineMat });
          }
        }

        // --- Decorative tree stumps for grass rows ---
        if (config.type === 'grass') {
          const stumpCount = 2 + Math.floor(Math.random() * 2); // 2–3
          const usedX = [];
          for (let s = 0; s < stumpCount; s++) {
            let sx;
            let tries = 0;
            do {
              sx = (Math.random() - 0.5) * (ROAD_WIDTH - 1.5);
              tries++;
            } while (usedX.some(ox => Math.abs(ox - sx) < 1.2) && tries < 20);
            usedX.push(sx);

            const stumpGeo = new THREE.CylinderGeometry(0.15, 0.2, 0.4, 6);
            const stumpMat = new THREE.MeshBasicMaterial({ color: 0x226622 });
            const stumpMesh = new THREE.Mesh(stumpGeo, stumpMat);
            stumpMesh.position.set(sx, 0.2, -rowIndex * ROW_DEPTH);
            scene.add(stumpMesh);
            disposables.push({ mesh: stumpMesh, geo: stumpGeo, mat: stumpMat });
          }
        }

        // --- Obstacle meshes ---
        const obstacles = [];
        for (const obsConfig of config.obstacles) {
          const bodyColor = obsConfig.type === 'car'   ? COLOR_CAR   : COLOR_TRUCK;
          const cabColor  = obsConfig.type === 'car'   ? 0xcc2222    : 0xcc6600;
          const group = buildVehicleMesh(obsConfig.width, obsConfig.height, obsConfig.depth, bodyColor, cabColor);
          group.position.set(obsConfig.x, 0, -obsConfig.row * ROW_DEPTH);
          scene.add(group);

          obstacles.push({
            type:      obsConfig.type,
            row:       rowIndex,
            x:         obsConfig.x,
            width:     obsConfig.width,
            depth:     obsConfig.depth,
            height:    obsConfig.height,
            speed:     obsConfig.speed,
            direction: obsConfig.direction,
            mesh:      group
          });
        }

        const row = {
          type:      config.type,
          index:     rowIndex,
          obstacles,
          dispose() {
            for (const d of disposables) {
              scene.remove(d.mesh);
              d.geo.dispose();
              d.mat.dispose();
            }
            for (const obs of obstacles) {
              scene.remove(obs.mesh);
              obs.mesh.traverse(child => {
                if (child.isMesh) {
                  child.geometry.dispose();
                  child.material.dispose();
                }
              });
            }
          }
        };

        this.rows.set(rowIndex, row);
      }
    }

    // -------------------------------------------------------------------------
    // Player
    // -------------------------------------------------------------------------
    function buildPlayerMesh(scene) {
      const group = new THREE.Group();

      // Body
      const bodyGeo = new THREE.BoxGeometry(0.7, 0.25, 1.1);
      const bodyMat = new THREE.MeshBasicMaterial({ color: COLOR_PLAYER });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.125; // half body height
      group.add(body);

      // Cab (slightly darker yellow, on top toward rear)
      const cabGeo = new THREE.BoxGeometry(0.5, 0.2, 0.55);
      const cabMat = new THREE.MeshBasicMaterial({ color: 0xddbb00 });
      const cab = new THREE.Mesh(cabGeo, cabMat);
      cab.position.set(0, 0.25 + 0.1, 0.15); // on top, rear-biased
      group.add(cab);

      scene.add(group);
      return group;
    }

    class Player {
      constructor(scene) {
        this._scene = scene;
        this.mesh   = buildPlayerMesh(scene);
        this.state  = this._defaultState();
        this._applyMeshPosition();
      }

      _defaultState() {
        return {
          worldX:  0,
          worldZ:  START_Z,
          velX:    0,
          velZ:    0,
          isAlive: true
        };
      }

      update(dt, keys, cameraRearZ, world) {
        const s = this.state;
        if (!s.isAlive) return;

        // Forward / backward
        const wantForward  = keys.has('ArrowUp')    || keys.has('w') || keys.has('W');
        const wantBackward = keys.has('ArrowDown')  || keys.has('s') || keys.has('S');
        const wantLeft     = keys.has('ArrowLeft')  || keys.has('a') || keys.has('A');
        const wantRight    = keys.has('ArrowRight') || keys.has('d') || keys.has('D');

        if (wantForward) {
          s.velZ += (-PLAYER_SPEED - s.velZ) * Math.min(1, ACCEL * dt);
        } else if (wantBackward) {
          s.velZ += (PLAYER_SPEED - s.velZ) * Math.min(1, ACCEL * dt);
        } else {
          s.velZ *= Math.max(0, 1 - FRICTION * dt);
        }

        if (wantLeft) {
          s.velX += (-PLAYER_LATERAL - s.velX) * Math.min(1, ACCEL * dt);
        } else if (wantRight) {
          s.velX += (PLAYER_LATERAL - s.velX) * Math.min(1, ACCEL * dt);
        } else {
          s.velX *= Math.max(0, 1 - FRICTION * dt);
        }

        s.worldX += s.velX * dt;
        s.worldZ += s.velZ * dt;

        // Clamp X to road edges
        const halfRoad = ROAD_WIDTH / 2 - 0.4;
        s.worldX = Math.max(-halfRoad, Math.min(halfRoad, s.worldX));

        // Clamp Z so player can't fall off the back of screen
        if (s.worldZ > cameraRearZ + 0.5) {
          s.worldZ = cameraRearZ + 0.5;
          if (s.velZ > 0) s.velZ = 0;
        }

        // Grass snap: when on a grass row and no forward/backward key held,
        // gently pull the car to the centre of that row and kill Z velocity.
        // This gives a natural "pause and align" feel on safe ground.
        if (world && !wantForward && !wantBackward) {
          const rowIndex = Math.round(-s.worldZ / ROW_DEPTH);
          const row = world.getRow(rowIndex);
          if (row && row.type === 'grass') {
            const rowCentreZ = -rowIndex * ROW_DEPTH;
            // Ease toward row centre (strong spring, feels snappy)
            s.worldZ += (rowCentreZ - s.worldZ) * Math.min(1, 12 * dt);
            // Kill residual Z velocity so the car stops cleanly
            s.velZ *= Math.max(0, 1 - 15 * dt);
          }
        }

        this._applyMeshPosition();
      }

      reset() {
        this.state = this._defaultState();
        this._applyMeshPosition();
      }

      _applyMeshPosition() {
        this.mesh.position.set(this.state.worldX, 0.125, this.state.worldZ);
      }
    }

    // -------------------------------------------------------------------------
    // Collision detection
    // -------------------------------------------------------------------------
    function checkCollision(playerState, world, playerRowIndex) {
      const px  = playerState.worldX;
      const pz  = playerState.worldZ;
      const phx = 0.32;
      const phz = 0.50;

      for (let ri = playerRowIndex - 1; ri <= playerRowIndex + 1; ri++) {
        const row = world.getRow(ri);
        if (!row) continue;
        for (const obs of row.obstacles) {
          const oz  = -obs.row * ROW_DEPTH;
          const ohx = obs.width / 2 - 0.05;
          const ohz = obs.depth / 2 - 0.05;
          if (Math.abs(px - obs.x) < phx + ohx &&
              Math.abs(pz - oz)    < phz + ohz) {
            return 'hit';
          }
        }
      }

      return 'none';
    }

    // -------------------------------------------------------------------------
    // HUD helpers
    // -------------------------------------------------------------------------
    const _scoreEl      = document.getElementById('hud-score');
    const _overlayEl    = document.getElementById('overlay');
    const _overlayScore = document.getElementById('overlay-score');

    function updateScoreDisplay(n) {
      _scoreEl.textContent = 'Score: ' + n;
    }

    function showGameOver(n) {
      _overlayScore.textContent = 'Score: ' + n;
      _overlayEl.classList.add('visible');
    }

    function hideGameOver() {
      _overlayEl.classList.remove('visible');
    }

    // -------------------------------------------------------------------------
    // Input
    // -------------------------------------------------------------------------
    const keys = new Set();
    const TRACKED_KEYS = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','W','s','S','a','A','d','D'];

    window.addEventListener('keydown', e => {
      if (TRACKED_KEYS.includes(e.key)) {
        e.preventDefault();
        keys.add(e.key);
      }
    });
    window.addEventListener('keyup', e => {
      keys.delete(e.key);
    });

    // -------------------------------------------------------------------------
    // Bootstrap
    // -------------------------------------------------------------------------
    const canvas   = document.getElementById('game-canvas');
    const renderer = new Renderer();
    const scene    = renderer.init(canvas);

    let gameState = 'playing';
    let score     = 0;

    const world  = new World();
    world.init(scene, score);

    const player = new Player(scene);

    // Snap camera instantly to spawn position so there's no lerp drift on frame 1
    renderer.snapTo(player.mesh.position);

    function triggerGameOver() {
      gameState = 'gameover';
      showGameOver(score);
    }

    document.getElementById('btn-restart').addEventListener('click', () => {
      keys.clear();
      player.reset();
      world.reset(0);
      score = 0;
      updateScoreDisplay(0);
      hideGameOver();
      renderer.snapTo(player.mesh.position);  // snap camera back to spawn
      gameState = 'playing';
    });

    // -------------------------------------------------------------------------
    // Game loop
    // -------------------------------------------------------------------------
    let lastTime = 0;

    function tick(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;

      if (gameState === 'playing') {
        const cameraRearZ = renderer.camera.position.z - renderer.CAMERA_OFFSET.z + 2;
        player.update(dt, keys, cameraRearZ, world);

        const playerRowIndex = Math.floor(-player.state.worldZ / ROW_DEPTH);
        world.update(dt, playerRowIndex, gameState, score);

        const hit = checkCollision(player.state, world, playerRowIndex);
        if (hit !== 'none') triggerGameOver();

        score = Math.max(0, Math.floor(-player.state.worldZ));
        updateScoreDisplay(score);
      }

      renderer.update(player.mesh.position);
      renderer.render();
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);

  </script>
</body>
</html>
